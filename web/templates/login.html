<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in &middot; Amoja Social</title>
    <meta name="description" content="Private sign-in for Amoja Social Manager.">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script>
        (function () {
            var saved = localStorage.getItem("amoja-theme");
            var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && prefersDark)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
</head>
<body class="auth-body">
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="login-title">
            <div class="auth-brand">
                <span class="brand-mark"><i data-lucide="send" aria-hidden="true"></i></span>
                <span>
                    <span class="brand-name">Amoja Social</span>
                    <span class="brand-subtitle">Manager</span>
                </span>
            </div>

            <p class="eyebrow">Private workspace</p>
            <h1 id="login-title">Sign in</h1>
            <p class="auth-intro">
                One owner, one workspace. Sign in to manage drafts, schedules and results.
            </p>

            <form class="auth-form" method="post" action="{{ url_for('auth.login', next=next_path) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next_path }}">

                <div class="auth-field">
                    <label for="username">Username</label>
                    <input class="input" id="username" name="username" type="text"
                           value="{{ username }}" autocomplete="username" required
                           maxlength="64" autocapitalize="none" spellcheck="false"
                           {% if not error %}autofocus{% endif %}>
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <input class="input" id="password" name="password" type="password"
                           autocomplete="current-password" required maxlength="128">
                </div>

                {% if error %}
                <p id="login-error" class="form-error" role="alert">{{ error }}</p>
                {% endif %}

                <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
            </form>

            <p class="auth-note">
                Five failed attempts lock sign-in for 15 minutes. No social platform
                is contacted until you connect an account.
            </p>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
